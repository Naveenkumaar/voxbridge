<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>voxbridge · console</title>
<style>
  :root { color-scheme: light dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --bot:#238636; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:16px; margin:0; } header .dot { color:var(--accent); }
  main { max-width:760px; margin:0 auto; padding:18px 16px; }
  #log { min-height:320px; }
  .msg { margin:8px 0; display:flex; gap:8px; }
  .msg .who { min-width:46px; color:var(--muted); font-size:12px; padding-top:2px; }
  .bubble { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px 12px; }
  .you .bubble { border-color:var(--accent); }
  .bot .bubble { border-color:var(--bot); }
  .row { display:flex; gap:8px; margin-top:14px; }
  input { flex:1; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:11px; font:inherit; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:0 18px; font:inherit; cursor:pointer; }
  .meta { color:var(--muted); font-size:12px; margin-top:6px; }
  .trace { color:var(--muted); font-size:11px; border-top:1px dashed var(--line); margin-top:10px; padding-top:8px; white-space:pre-wrap; display:none; }
  .toggle { color:var(--accent); cursor:pointer; font-size:12px; }
  .receipt { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px; }
  .receipt .rt { color:var(--accent); font-weight:600; margin-bottom:6px; }
  .receipt .rk { color:var(--muted); display:inline-block; min-width:96px; }
</style>
</head>
<body>
  <header><span class="dot">◉</span><h1>voxbridge console</h1><span class="meta" id="backend"></span></header>
  <main>
    <div id="log"></div>
    <div class="row">
      <input id="msg" placeholder="Try: 'Hi, I'd like to book a table for 4 tomorrow at 7pm, name's Naveen'" autofocus />
      <button id="send">Send</button>
    </div>
    <div class="meta"><span class="toggle" id="t">show pipeline trace</span> · session resets after each booking</div>
    <div class="trace" id="trace"></div>
  </main>
<script>
const sid = 'web-' + Math.floor(Date.now() / 1000);
const log = document.getElementById('log');
function bubble(who, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + (who === 'you' ? 'you' : 'bot');
  el.innerHTML = `<div class="who">${who}</div><div class="bubble">${text}</div>`;
  log.appendChild(el); window.scrollTo(0, document.body.scrollHeight);
}
async function send() {
  const input = document.getElementById('msg');
  const text = input.value.trim(); if (!text) return;
  bubble('you', text); input.value = '';
  const res = await fetch('/v1/turns', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ text, session_id: sid })
  });
  const data = await res.json();
  bubble('bot', data.reply + (data.booking_ref ? ` <b>(${data.booking_ref})</b>` : ''));
  if (data.receipt) {
    const rows = Object.entries(data.receipt)
      .map(([k, v]) => `<div><span class="rk">${k}</span> ${v}</div>`).join('');
    bubble('bot', `<div class="receipt"><div class="rt">🧾 booking receipt</div>${rows}</div>`);
  }
  const lines = (data.trace || []).map(s => {
    const ms = (s.ms != null ? s.ms.toFixed(1).padStart(6) + ' ms' : '        ');
    const rest = Object.fromEntries(Object.entries(s).filter(([k]) => k !== 'stage' && k !== 'ms'));
    return `${ms}  ${s.stage.padEnd(9)} ${JSON.stringify(rest)}`;
  });
  if (data.total_ms != null) lines.push(`${data.total_ms.toFixed(1).padStart(6)} ms  total`);
  document.getElementById('trace').textContent = lines.join('\n');
}
document.getElementById('send').onclick = send;
document.getElementById('msg').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
document.getElementById('t').onclick = () => {
  const t = document.getElementById('trace');
  t.style.display = t.style.display === 'block' ? 'none' : 'block';
};
fetch('/health').then(r => r.json()).then(h =>
  document.getElementById('backend').textContent = `stt:${h.stt} · tts:${h.tts}`);
</script>
</body>
</html>
